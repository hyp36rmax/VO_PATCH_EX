name: Compact catalog regression
on:
  push:
    branches: [maintenance/r0181-final-compact, Experience]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y nasm xvfb
      - run: pip install pyflakes unicorn pillow capstone
      - run: xvfb-run -a python tools/check.py
      - run: python tools/experience/test_package_compression.py
      - run: python tools/experience/test_compact_catalog.py
      - run: python tools/experience/test_bosses.py
      - run: python tools/attributiontest.py
